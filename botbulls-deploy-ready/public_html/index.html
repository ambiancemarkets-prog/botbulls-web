            terminal: {

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html {
      font-family: 'Inter', system-ui, sans-serif;
      overflow-y: auto;
      scroll-behavior: smooth;
      height: auto;
      width: 100%;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: clip;
      overflow-y: visible;
      width: 100%;
      max-width: 100vw;
      margin: 0;
      -webkit-tap-highlight-color: transparent;
    }
    #app { width: 100%; max-width: 100vw; overflow-x: clip; }
    .safe-bottom { padding-bottom: max(0.5rem, env(safe-area-inset-bottom)); }
    .safe-top { padding-top: env(safe-area-inset-top); }
    .ticker-wrap { width: 100%; max-width: 100vw; overflow: hidden; white-space: nowrap; }
    .ticker-track { display: inline-flex; animation: tickerScroll 36s linear infinite; will-change: transform; }
    .ticker-track:hover { animation-play-state: paused; }
    @keyframes tickerScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    [dir="rtl"] .ticker-track { animation-direction: reverse; }
    .pulse-dot { animation: pulseRing 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulseRing {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.25); }
    }
    .bot-flow-line { stroke-dasharray: 6 6; animation: dashFlow 1.6s linear infinite; }
    @keyframes dashFlow { to { stroke-dashoffset: -24; } }
    .sheet-up { animation: sheetSlideUp 0.22s ease-out; }
    @keyframes sheetSlideUp {
      from { transform: translateY(100%); opacity: 0.5; }
      to { transform: translateY(0); opacity: 1; }
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.35); border-radius: 9999px; }
  </style>

      function generateQrSVG(seedText) {
        let hash = 2166136261;
        for (let i = 0; i < seedText.length; i++) {
          hash ^= seedText.charCodeAt(i);
          hash = Math.imul(hash, 16777619);
        }
        const size = 21;
        let rects = '';
        const isFinder = (r, c) =>
          (r < 7 && c < 7) || (r < 7 && c >= size - 7) || (r >= size - 7 && c < 7);
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            let on = false;
            if (isFinder(r, c)) {
              const lr = r >= size - 7 ? r - (size - 7) : r;
              const lc = c >= size - 7 ? c - (size - 7) : c;
              on = lr === 0 || lr === 6 || lc === 0 || lc === 6 || (lr >= 2 && lr <= 4 && lc >= 2 && lc <= 4);
            } else {
              const bit = Math.abs(Math.imul(hash ^ (r * 31 + c * 17), 2654435761)) % 11;
              on = bit < 5;
            }
            if (on) rects += `<rect x="${c * 8 + 8}" y="${r * 8 + 8}" width="8" height="8" fill="#0f172a"/>`;
          }
        }
        return `<svg viewBox="0 0 184 184" class="w-40 h-40 rounded-lg bg-white p-1.5 border border-slate-200 shadow-sm">${rects}</svg>`;
      }

              auditLogs: json.state.auditLogs || state.auditLogs,
              payoutConfig: json.state.payoutConfig || state.payoutConfig,

        if (state.view === 'user' && state.userTab === 'overview') drawCandlestickChart('user-chart-canvas');

      function generateFallbackCandles(pair) {
        const baseObj = state.tickers.find(x => x.symbol === pair) || state.tickers[0];
        let price = baseObj.price * 0.99;
        const vol = baseObj.price * 0.004;
        const candles = [];
        for (let i = 0; i < 44; i++) {
          const open = price;
          const delta = (Math.sin(i * 0.65) * 0.45 + (Math.random() - 0.48)) * vol;
          const close = Math.max(0.0001, open + delta);
          const high = Math.max(open, close) + Math.random() * vol * 0.6;
          const low = Math.min(open, close) - Math.random() * vol * 0.6;
          candles.push({ open, high, low, close, vol: Math.round(40 + Math.random() * 140) });
          price = close;
        }
        state.chartCandles = candles;
      }

      function escapeHtml(str) {

      function copyText(text, label = 'Copied') {

      function fallbackCopy(text, label) {
        const ta = document.createElement('textarea');

      function nowStamp() {
        const d = new Date();
        const pad = n => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }

      // IST (India Standard Time, UTC+5:30) Calendar Day Counter
      // Day 1 on activation date; auto-advances +1 every night at 12:00 AM IST; expires permanently after Day 90.
      function getIstDateKey(ms = Date.now()) {
        const ist = new Date(ms + 19800000);
        const y = ist.getUTCFullYear();
        const m = String(ist.getUTCMonth() + 1).padStart(2, '0');
        const d = String(ist.getUTCDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }

      function extractDateKey(str) {
        const m = String(str || '').match(/(\d{4}-\d{2}-\d{2})/);
        return m ? m[1] : getIstDateKey();
      }

      function getPlanIstDayNumber(pl) {
        const startKey = pl.startIstDate || extractDateKey(pl.activatedAt);
        const [sy, sm, sd] = startKey.split('-').map(Number);
        const [cy, cm, cd] = getIstDateKey().split('-').map(Number);
        const diffDays = Math.floor((Date.UTC(cy, cm - 1, cd) - Date.UTC(sy, sm - 1, sd)) / 86400000);
        return Math.max(1, diffDays + 1);
      }

      function isPlanExpired(pl) {
        return getPlanIstDayNumber(pl) > (pl.maxDays || CYCLE_TOTAL_DAYS);
      }

      function getPlanDisplayDay(pl) {
        return Math.min(pl.maxDays || CYCLE_TOTAL_DAYS, getPlanIstDayNumber(pl));
      }

      function normalizeUserPlans(u) {
        if (!u) return [];
        if (!Array.isArray(u.activePlans)) {
          u.activePlans = [];
          if (u.planActive && Number(u.planAmount) > 0) {
            u.activePlans.push({
              id: 'PLN-' + String(u.id || '0000').slice(-4),
              amount: Number(u.planAmount),
              startIstDate: extractDateKey(u.lastActive),
              maxDays: CYCLE_TOTAL_DAYS,
              active: true,
              activatedAt: u.lastActive || nowStamp(),
            });
          }
        }
        u.activePlans.forEach(pl => {
          if (!pl.startIstDate) pl.startIstDate = extractDateKey(pl.activatedAt);
          if (!pl.maxDays) pl.maxDays = CYCLE_TOTAL_DAYS;
        });
        return u.activePlans;
      }

      function getActivePlans(u) {
        return normalizeUserPlans(u).filter(pl => pl.active && Number(pl.amount) > 0 && !isPlanExpired(pl));
      }

      function getTotalActivePlanAmount(u) {
        return getActivePlans(u).reduce((sum, pl) => sum + Number(pl.amount || 0), 0);
      }

      function syncLegacyPlanFields(u) {
        const all = normalizeUserPlans(u);
        const active = getActivePlans(u);
        u.planAmount = getTotalActivePlanAmount(u);
        u.planActive = active.length > 0;
        u.payoutDaysUsed = active.length
          ? Math.max(...active.map(pl => getPlanDisplayDay(pl)))
          : (all.length ? CYCLE_TOTAL_DAYS : 0);
      }

      function isUserEligible(u) {
        return Boolean(u && u.botActive && getActivePlans(u).length > 0);
      }

      function getDownlineByLevel(rootUserId) {
        const result = [];
        let frontier = [rootUserId];
        for (let level = 1; level <= 5; level++) {
          const children = state.users.filter(u => frontier.includes(u.referredBy));
          children.forEach(c => result.push({ user: c, level, split: REFERRAL_SPLITS[level - 1].pct }));
          frontier = children.map(c => c.id);
          if (!frontier.length) break;
        }
        return result;
      }

      function getUplines(userId) {
        const uplines = [];
        let curr = state.users.find(u => u.id === userId);
        for (let level = 1; level <= 5; level++) {
          if (!curr || !curr.referredBy) break;
          const parent = state.users.find(u => u.id === curr.referredBy);
          if (!parent) break;
          uplines.push({ user: parent, level, pct: REFERRAL_SPLITS[level - 1].pct });
          curr = parent;
        }
        return uplines;
      }

      let chartHoverIdx = -1;
      function drawCandlestickChart(canvasId) {
        const canvas = document.getElementById(canvasId);
        if (!canvas || !canvas.parentElement) return;
        const parent = canvas.parentElement;
        const rect = parent.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const w = Math.max(220, Math.floor(rect.width || parent.clientWidth || 300));
        const h = Math.max(180, Math.floor(rect.height || parent.clientHeight || 240));
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);

        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);
        const isDark = state.darkMode;
        ctx.fillStyle = isDark ? '#0b1220' : '#f8fafc';
        ctx.fillRect(0, 0, w, h);

        const candles = state.chartCandles;
        if (!candles.length) return;
        const compact = w < 420;
        const padL = 8, padR = compact ? 54 : 66, padT = 22, padB = 20;
        const plotW = Math.max(40, w - padL - padR);
        const plotH = Math.max(40, h - padT - padB);

        let minP = Infinity, maxP = -Infinity;
        candles.forEach(c => { if (c.low < minP) minP = c.low; if (c.high > maxP) maxP = c.high; });
        const range = (maxP - minP) || 1;
        const yFor = p => padT + ((maxP - p) / range) * plotH;

        ctx.strokeStyle = isDark ? 'rgba(148,163,184,0.12)' : 'rgba(100,116,139,0.18)';
        ctx.fillStyle = isDark ? '#94a3b8' : '#475569';
        ctx.font = (compact ? '9px' : '10px') + ' JetBrains Mono, monospace';
        for (let i = 0; i <= 4; i++) {
          const y = padT + (plotH / 4) * i;
          const p = maxP - (range / 4) * i;
          ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
          const dp = p > 100 ? 2 : 4;
          ctx.fillText(p.toFixed(dp), w - padR + 4, y + 3);
        }

        const step = plotW / candles.length;
        const bodyW = Math.max(2.5, step * 0.62);
        candles.forEach((c, idx) => {
          const x = padL + idx * step + step / 2;
          const bull = c.close >= c.open;
          const col = bull ? '#10b981' : '#f43f5e';
          ctx.strokeStyle = col;
          ctx.fillStyle = col;
          ctx.lineWidth = 1.25;
          ctx.beginPath();
          ctx.moveTo(x, yFor(c.high));
          ctx.lineTo(x, yFor(c.low));
          ctx.stroke();

          const yTop = yFor(Math.max(c.open, c.close));
          const yBot = yFor(Math.min(c.open, c.close));
          ctx.fillRect(x - bodyW / 2, yTop, bodyW, Math.max(2, yBot - yTop));
        });

        // Live current price dashed line
        const latest = candles[candles.length - 1];
        const yLatest = yFor(latest.close);
        ctx.strokeStyle = 'rgba(16,185,129,0.5)';
        ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.moveTo(padL, yLatest); ctx.lineTo(w - padR, yLatest); ctx.stroke();
        ctx.setLineDash([]);

        const activeIdx = chartHoverIdx >= 0 && chartHoverIdx < candles.length ? chartHoverIdx : candles.length - 1;
        const ac = candles[activeIdx];
        const dp = ac.close > 100 ? 2 : 4;
        if (chartHoverIdx >= 0) {
          const hx = padL + activeIdx * step + step / 2;
          ctx.strokeStyle = 'rgba(6,182,212,0.6)';
          ctx.setLineDash([4, 4]);
          ctx.beginPath(); ctx.moveTo(hx, padT); ctx.lineTo(hx, h - padB); ctx.stroke();
          ctx.setLineDash([]);
        }
        ctx.fillStyle = isDark ? '#e2e8f0' : '#0f172a';
        ctx.font = (compact ? '9.5px' : '11px') + ' JetBrains Mono, monospace';
        const label = compact
          ? `${state.selectedPair} ${state.selectedTimeframe} C:${ac.close.toFixed(dp)}`
          : `${state.selectedPair} (${state.selectedTimeframe})  O:${ac.open.toFixed(dp)}  H:${ac.high.toFixed(dp)}  L:${ac.low.toFixed(dp)}  C:${ac.close.toFixed(dp)}`;
        ctx.fillText(label, padL + 2, 14);
      }

      // =========================================================================
      // 11. MASTER RENDER & EVENT BINDING
      // =========================================================================
      function applyDocumentFlags() {
        const langObj = LANGUAGES.find(l => l.code === state.lang) || LANGUAGES[0];
        document.documentElement.lang = langObj.code;
        document.documentElement.dir = langObj.rtl ? 'rtl' : 'ltr';
        document.documentElement.classList.toggle('dark', state.darkMode);
      }

      let activeChartObserver = null;
      function attachChartInteractions(canvasId) {
        const c = document.getElementById(canvasId);
        if (!c) return;
        if (activeChartObserver) { activeChartObserver.disconnect(); activeChartObserver = null; }
        if (window.ResizeObserver && c.parentElement) {
          activeChartObserver = new ResizeObserver(() => drawCandlestickChart(canvasId));
          activeChartObserver.observe(c.parentElement);
        }
        const updateHoverFromClientX = (clientX) => {
          const rect = c.getBoundingClientRect();
          const frac = (clientX - rect.left - 8) / Math.max(1, rect.width - 70);
          chartHoverIdx = Math.max(0, Math.min(state.chartCandles.length - 1, Math.floor(frac * state.chartCandles.length)));
          drawCandlestickChart(canvasId);
        };
        c.onmousemove = (e) => updateHoverFromClientX(e.clientX);
        c.onmouseleave = () => { chartHoverIdx = -1; drawCandlestickChart(canvasId); };
        c.ontouchstart = (e) => { if (e.touches[0]) updateHoverFromClientX(e.touches[0].clientX); };
        c.ontouchmove = (e) => { if (e.touches[0]) updateHoverFromClientX(e.touches[0].clientX); };
        c.ontouchend = () => { chartHoverIdx = -1; drawCandlestickChart(canvasId); };
      }

      function render() {
        applyDocumentFlags();
        saveSession();
        const root = document.getElementById('app');
        if (state.view === 'public') root.innerHTML = renderPublicSite();
        else if (state.view === 'auth') root.innerHTML = renderAuthView();
        else if (state.view === 'user') root.innerHTML = renderUserPanel();
        else if (state.view === 'admin-login') root.innerHTML = renderAdminLogin();
        else if (state.view === 'admin') root.innerHTML = renderAdminPortal();

        if (window.lucide && window.lucide.createIcons) window.lucide.createIcons();
        updateLiveBadgesInPlace();
        bindEvents();

        if (state.view === 'public') {
          drawCandlestickChart('public-chart-canvas');
          attachChartInteractions('public-chart-canvas');
        }
        if (state.view === 'user' && state.userTab === 'overview') {
          drawCandlestickChart('user-chart-canvas');
          attachChartInteractions('user-chart-canvas');
        }
      }

        document.querySelectorAll('[data-action="open-login"]').forEach(b => b.addEventListener('click', () => { state.mobileMenuOpen = false; state.authMode = 'login'; state.view = 'auth'; render(); }));

        document.querySelectorAll('[data-action="set-auth-login"]').forEach(b => b.addEventListener('click', () => { state.authMode = 'login'; render(); }));
        document.querySelectorAll('[data-action="set-auth-register"]').forEach(b => b.addEventListener('click', () => { state.authMode = 'register'; render(); }));
        document.querySelectorAll('[data-action="user-logout"]').forEach(b => b.addEventListener('click', () => { state.mobileMoreSheetOpen = false; state.impersonatingFromPartnersLog = false; state.currentUserId = null; state.view = 'public'; clearUserSession(); showToast('Logged out cleanly', 'info'); render(); }));
        document.querySelectorAll('[data-action="admin-logout"]').forEach(b => b.addEventListener('click', () => { state.adminAuthed = false; state.view = 'admin-login'; clearAdminSession(); showToast('Partners Log session closed', 'info'); render(); }));

        // Return to Partners Log from impersonated User Panel

        // Assign / Link Upline Sponsor to any user from Partners Log (blocks self/circular loops)

            state.news.unshift({
              id: 'UPD-' + Date.now(),
              category: 'MARKETS',
              source: 'BotBulls Market Desk',
              time: 'Just now',
              title: 'Liquidity Pulse: BTC/USD & Gold Track Live Global Sessions',
              summary: 'Market bulletin refreshed with latest forex and digital asset session commentary.',
            });
            state.news = state.news.slice(0, 6);
            showToast('Market feed refreshed');
            render();
          });
        });

        // Login form (pulls latest server DB first so newly registered users always log in!)
        const loginForm = document.getElementById('login-form');
        if (loginForm) {
          loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            await pullStateFromServer(false);
            const fd = new FormData(loginForm);
            const email = String(fd.get('email')).trim().toLowerCase();
            const pass = String(fd.get('password'));
            const found = state.users.find(u => String(u.email || '').trim().toLowerCase() === email && u.password === pass);
            if (!found) { showToast('Invalid email or password.', 'error'); return; }
            state.currentUserId = found.id;
            found.lastActive = nowStamp();
            state.auditLogs.unshift({ time: nowStamp(), actor: found.id, role: 'USER', ip: found.ip, action: 'USER_LOGIN', detail: 'User panel session started' });
            state.view = 'user';
            state.userTab = 'overview';
            showToast(`Welcome back, ${found.name}!`);
            await commitMutation();
          });
        }

        // Register form (strict duplicate-email check against synced DB + phone number)
        const regForm = document.getElementById('register-form');
        if (regForm) {
          regForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            await pullStateFromServer(false);
            const fd = new FormData(regForm);
            const email = String(fd.get('email')).trim().toLowerCase();
            const phone = String(fd.get('phone') || '').trim();
            const errBox = document.getElementById('register-error-box');
            if (state.users.some(u => String(u.email || '').trim().toLowerCase() === email)) {
              const msg = 'This email ID is already registered in the database. Please use a different email address.';
              if (errBox) { errBox.textContent = msg; errBox.classList.remove('hidden'); }
              showToast(msg, 'error');
              return;
            }
            if (errBox) errBox.classList.add('hidden');
            let rawRef = String(fd.get('refCode') || '').trim();
            const refUrlMatch = rawRef.match(/[?&]ref=([^&\s]+)/i);
            if (refUrlMatch) rawRef = decodeURIComponent(refUrlMatch[1]).trim();
            const refInput = rawRef.toUpperCase();
            let refUser = null;
            if (refInput) {
              refUser = state.users.find(u =>
                String(u.referralCode || '').trim().toUpperCase() === refInput ||
                String(u.id || '').trim().toUpperCase() === refInput ||
                String(u.email || '').trim().toUpperCase() === refInput
              );
              if (!refUser) {
                const msg = `Referral ID "${rawRef}" not found. Check the Referrer ID or leave it blank.`;
                if (errBox) { errBox.textContent = msg; errBox.classList.remove('hidden'); }
                showToast(msg, 'error');
                return;
              }
            }
            state.pendingRefCode = '';
            const maxNum = state.users.reduce((mx, u) => {
              const m = String(u.id || '').match(/(\d+)$/);
              return Math.max(mx, m ? Number(m[1]) : 1041);
            }, 1041);
            const nextNum = maxNum + 1;
            const newUser = {
              id: `BB-USR-${nextNum}`,
              name: String(fd.get('name')).trim(),
              email,
              phone: phone || 'Not provided',
              password: String(fd.get('password')),
              referralCode: `BBREF${nextNum}`,
              referredBy: refUser ? refUser.id : null,
              wallet: 0.00,
              planAmount: 0,
              planActive: false,
              activePlans: [],
              botActive: false,
              payoutDaysUsed: 0,
              ip: '103.82.14.' + (20 + (state.users.length % 200)),
              lastActive: nowStamp(),
            };
            state.users.push(newUser);
            state.currentUserId = newUser.id;
            state.auditLogs.unshift({ time: nowStamp(), actor: newUser.id, role: 'USER', ip: newUser.ip, action: 'USER_REGISTER', detail: refUser ? `Referred by ${refUser.id}` : 'Direct signup' });
            state.view = 'user';
            state.userTab = 'deposit';
            showToast(`Account ${newUser.id} created! Balance: $0.00 — Submit a deposit for Partners Log approval.`, 'info');
            await commitMutation();
          });
        }

        // Activate $25 Bot
        document.querySelectorAll('[data-action="activate-bot"]').forEach(btn => {
          btn.addEventListener('click', () => {
            const user = getCurrentUser();
            if (user.wallet < BOT_FEE_USD) { showToast('Insufficient wallet balance ($25 required).', 'error'); return; }
            user.wallet = Number((user.wallet - BOT_FEE_USD).toFixed(2));
            user.botActive = true;
            getActivePlans(user).forEach(pl => creditInstantActivationReferrals(user, pl));
            state.transactions.unshift({
              ref: 'BOT-' + Math.floor(10000 + Math.random() * 90000),
              userId: user.id, type: 'BOT_ACTIVATION', rail: 'INTERNAL',
              gross: 25, fee: 0, net: 25, status: 'COMPLETED', note: '$25 Automated Bot Activated', proof: '', time: nowStamp(),
            });
            showToast('$25 Bot activated successfully!');
            commitMutation();
          });
        });

        // Activate Plan (UNLIMITED stackable 90-Day Plans — never overwrites existing plans!)
        document.querySelectorAll('[data-activate-plan]').forEach(btn => {
          btn.addEventListener('click', () => {
            const amt = Number(btn.dataset.activatePlan);
            const user = getCurrentUser();
            if (user.wallet < amt) { showToast(`Insufficient balance ($${amt} required).`, 'error'); return; }
            user.wallet = Number((user.wallet - amt).toFixed(2));
            const plans = normalizeUserPlans(user);
            const planId = 'PLN-' + Math.floor(10000 + Math.random() * 90000);
            const newPlanObj = {
              id: planId,
              amount: amt,
              startIstDate: getIstDateKey(),
              maxDays: CYCLE_TOTAL_DAYS,
              active: true,
              refCredited: false,
              activatedAt: nowStamp(),
            };
            plans.unshift(newPlanObj);
            syncLegacyPlanFields(user);
            creditInstantActivationReferrals(user, newPlanObj);
            const totalActive = getTotalActivePlanAmount(user);
            state.transactions.unshift({
              ref: planId,
              userId: user.id, type: 'PLAN_ACTIVATION', rail: 'INTERNAL',
              gross: amt, fee: 0, net: amt, status: 'COMPLETED',
              note: `Activated $${amt} Plan (90-Day Cycle • Total Active: $${totalActive})`, proof: '', time: nowStamp(),
            });
            showToast(`$${amt} Plan added! Total Active Plans: $${totalActive.toLocaleString()} (${getActivePlans(user).length} plan${getActivePlans(user).length > 1 ? 's' : ''}).`);
            commitMutation();
          });
        });

        // History filter buttons
        document.querySelectorAll('[data-history-filter]').forEach(btn => {
          btn.addEventListener('click', () => { state.historyFilter = btn.dataset.historyFilter; render(); });
        });

        // P2P Transfer
        const p2pForm = document.getElementById('p2p-form');
        if (p2pForm) {
          p2pForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const user = getCurrentUser();
            const fd = new FormData(p2pForm);
            const recStr = String(fd.get('recipient')).trim();
            const amt = Number(fd.get('amount'));
            const note = String(fd.get('note') || '').trim();
            const target = state.users.find(u => u.id.toUpperCase() === recStr.toUpperCase() || u.email.toLowerCase() === recStr.toLowerCase());
            if (!target) { showToast('Recipient User ID or Email not found.', 'error'); return; }
            if (target.id === user.id) { showToast('Cannot send P2P transfer to yourself.', 'error'); return; }
            if (!Number.isFinite(amt) || amt <= 0 || user.wallet < amt) { showToast('Insufficient wallet balance.', 'error'); return; }
            user.wallet = Number((user.wallet - amt).toFixed(2));
            target.wallet = Number((target.wallet + amt).toFixed(2));
            const ref = 'P2P-' + Math.floor(10000 + Math.random() * 90000);
            state.transactions.unshift({ ref: ref + 'R', userId: target.id, type: 'P2P_RECEIVED', rail: 'INTERNAL', gross: amt, fee: 0, net: amt, status: 'COMPLETED', note: note || `From ${user.id}`, proof: '', time: nowStamp() });
            state.transactions.unshift({ ref: ref + 'S', userId: user.id, type: 'P2P_SENT', rail: 'INTERNAL', gross: amt, fee: 0, net: amt, status: 'COMPLETED', note: note || `To ${target.id}`, proof: '', time: nowStamp() });
            showToast(`Sent $${amt.toFixed(2)} to ${target.id} (${target.name})`);
            commitMutation();
          });
        }

        // Deposit rail & proof upload
        document.querySelectorAll('[data-dep-rail]').forEach(b => b.addEventListener('click', () => { state.depositRail = b.dataset.depRail; render(); }));
        const proofInput = document.getElementById('deposit-proof-input');
        if (proofInput) {
          proofInput.addEventListener('change', (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => { state.depositProofDataUrl = reader.result; state.depositProofName = file.name; render(); };
            reader.readAsDataURL(file);
          });
        }
        const depForm = document.getElementById('deposit-form');
        if (depForm) {
          depForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const user = getCurrentUser();
            const fd = new FormData(depForm);
            const amt = Number(fd.get('amount'));
            const note = String(fd.get('note')).trim();
            if (state.depositRail === 'CRYPTO' && !state.depositProofDataUrl) {
              showToast('Please attach a screenshot/photo proof for Manual Crypto deposit.', 'error'); return;
            }
            const ref = 'DEP-' + Math.floor(10000 + Math.random() * 90000);
            state.transactions.unshift({
              ref, userId: user.id, type: 'DEPOSIT', rail: state.depositRail,
              gross: amt, fee: 0, net: amt, status: 'PENDING', note,
              proof: state.depositProofDataUrl || SAMPLE_RECEIPT_URI, time: nowStamp(),
            });
            state.depositProofDataUrl = '';
            state.depositProofName = '';
            showToast(`Deposit ${ref} submitted for Partners Log verification.`);
            state.userTab = 'wallet';
            commitMutation();
          });
        }

        // Withdraw rail, live fee preview & STRICT $50.00 MINIMUM CHECK
        document.querySelectorAll('[data-wdr-rail]').forEach(b => b.addEventListener('click', () => { state.withdrawRail = b.dataset.wdrRail; render(); }));
        const wdrInput = document.getElementById('withdraw-amount-input');
        if (wdrInput) {
          wdrInput.addEventListener('input', () => {
            const val = Number(wdrInput.value || 0);
            const grossEl = document.getElementById('wdr-gross-preview');
            const netEl = document.getElementById('wdr-net-preview');
            const errBox = document.getElementById('withdraw-error-box');
            if (grossEl) grossEl.textContent = `$${Math.max(0, val).toFixed(2)}`;
            if (netEl) netEl.textContent = `$${Math.max(0, val - WITHDRAWAL_FEE_USD).toFixed(2)}`;
            if (errBox && val > 0 && val < MIN_WITHDRAWAL_USD) {
              errBox.textContent = MIN_WITHDRAWAL_ERROR;
              errBox.classList.remove('hidden');
            } else if (errBox) {
              errBox.classList.add('hidden');
            }
          });
        }
        const wdrForm = document.getElementById('withdraw-form');
        if (wdrForm) {
          wdrForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const user = getCurrentUser();
            const fd = new FormData(wdrForm);
            const gross = Number(fd.get('amount'));
            const dest = String(fd.get('destination')).trim();
            const errBox = document.getElementById('withdraw-error-box');

            if (!Number.isFinite(gross) || gross < MIN_WITHDRAWAL_USD) {
              if (errBox) { errBox.textContent = MIN_WITHDRAWAL_ERROR; errBox.classList.remove('hidden'); }
              showToast('Withdrawal blocked: below $50.00 minimum.', 'error');
              return;
            }
            if (user.wallet < gross) {
              showToast('Insufficient wallet balance.', 'error'); return;
            }
            const net = Number((gross - WITHDRAWAL_FEE_USD).toFixed(2));
            user.wallet = Number((user.wallet - gross).toFixed(2));
            const ref = 'WDR-' + Math.floor(10000 + Math.random() * 90000);
            state.transactions.unshift({
              ref, userId: user.id, type: 'WITHDRAWAL', rail: state.withdrawRail,
              gross, fee: WITHDRAWAL_FEE_USD, net, status: 'PENDING', note: `${state.withdrawRail}: ${dest}`, proof: '', time: nowStamp(),
            });
            showToast(`Withdrawal ${ref} submitted (Net $${net.toFixed(2)} after $1.20 fee).`);
            state.userTab = 'wallet';
            commitMutation();
          });
        }

        // Admin login (admin / ayaz1104)
        const adminLoginForm = document.getElementById('admin-login-form');
        if (adminLoginForm) {
          adminLoginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const fd = new FormData(adminLoginForm);
            if (String(fd.get('username')).trim() === 'admin' && String(fd.get('password')) === 'ayaz1104') {
              state.adminAuthed = true;
              state.view = 'admin';
              state.auditLogs.unshift({ time: nowStamp(), actor: 'partners-log', role: 'PARTNERS_LOG', ip: '172.68.14.9', action: 'ADMIN_LOGIN', detail: 'Partners Log authenticated' });
              showToast('Partners Log authenticated.');
              pullStateFromServer(true);
              render();
            } else {
              showToast('Invalid Partners Log credentials.', 'error');
            }
          });
        }

        // Admin payout presets & execution (90-day cycle)
        document.querySelectorAll('[data-admin-preset]').forEach(b => {
          b.addEventListener('click', () => { state.payoutConfig.percent = Number(b.dataset.adminPreset); render(); });
        });
        const adminPayoutForm = document.getElementById('admin-payout-form');
        if (adminPayoutForm) {
          adminPayoutForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const fd = new FormData(adminPayoutForm);
            const pct = Math.min(10, Math.max(0.1, Number(fd.get('percent'))));
            const tranches = Number(fd.get('tranches') || 1);
            const incDay = fd.get('incrementDay') === 'on';
            state.payoutConfig = { percent: pct, tranches, incrementDay: incDay };
            const tranchePct = pct / tranches;

            let creditedCount = 0, totalPaid = 0, totalRefPaid = 0;
            state.users.forEach(u => {
              if (!isUserEligible(u)) return;
              const activePlans = getActivePlans(u);
              const totalActiveAmt = getTotalActivePlanAmount(u);
              const credit = Number(((totalActiveAmt * tranchePct) / 100).toFixed(2));
              if (credit <= 0) return;
              u.wallet = Number((u.wallet + credit).toFixed(2));
              syncLegacyPlanFields(u);
              creditedCount++;
              totalPaid += credit;
              const breakdown = activePlans.map(pl => '$' + pl.amount).join(' + ');
              state.transactions.unshift({
                ref: 'PAY-' + Math.floor(10000 + Math.random() * 90000),
                userId: u.id, type: 'PERCENTAGE_PAYOUT', rail: 'INTERNAL',
                gross: credit, fee: 0, net: credit, status: 'COMPLETED',
                note: `Partners Log ${tranchePct.toFixed(2)}% on ${activePlans.length} plan(s) (${breakdown} = $${totalActiveAmt})`, proof: '', time: nowStamp(),
              });

              getUplines(u.id).forEach(up => {
                if (!isUserEligible(up.user)) return;
                const refBonus = Number(((credit * up.pct) / 100).toFixed(2));
                if (refBonus <= 0) return;
                up.user.wallet = Number((up.user.wallet + refBonus).toFixed(2));
                totalRefPaid += refBonus;
                state.transactions.unshift({
                  ref: 'REF-' + Math.floor(10000 + Math.random() * 90000),
                  userId: up.user.id, type: 'REFERRAL_EARNING', rail: 'INTERNAL',
                  gross: refBonus, fee: 0, net: refBonus, status: 'COMPLETED',
                  note: `L${up.level} (${up.pct.toFixed(2)}% of 2.5% pool) from ${u.id}`, proof: '', time: nowStamp(),
                });
              });
            });

            state.auditLogs.unshift({
              time: nowStamp(), actor: 'partners-log', role: 'PARTNERS_LOG', ip: '172.68.14.9',
              action: 'PERCENTAGE_DISTRIBUTION',
              detail: `${tranchePct.toFixed(2)}% tranche to ${creditedCount} eligible users ($${totalPaid.toFixed(2)}) + $${totalRefPaid.toFixed(2)} referrals`,
            });
            showToast(`Distributed $${totalPaid.toFixed(2)} to ${creditedCount} eligible users!`);
            commitMutation();
          });
        }

        // Partners Log user wallet, plan & bot controls (custom amount + live server sync)
        document.querySelectorAll('[data-admin-credit]').forEach(b => b.addEventListener('click', () => {
          const id = b.dataset.adminCredit;
          const u = state.users.find(x => x.id === id);
          const inp = document.querySelector(`[data-admin-amt="${id}"]`);
          const amt = Math.max(0.01, Number(inp ? inp.value : 100) || 100);
          if (u) {
            u.wallet = Number((u.wallet + amt).toFixed(2));
            state.transactions.unshift({ ref: 'ADJ-' + Math.floor(10000 + Math.random() * 90000), userId: u.id, type: 'ADMIN_ADJUSTMENT', rail: 'INTERNAL', gross: amt, fee: 0, net: amt, status: 'COMPLETED', note: 'Partners Log Wallet Credit', proof: '', time: nowStamp() });
            showToast(`Credited $${amt.toFixed(2)} to ${u.id}`);
            commitMutation();
          }
        }));
        document.querySelectorAll('[data-admin-debit]').forEach(b => b.addEventListener('click', () => {
          const id = b.dataset.adminDebit;
          const u = state.users.find(x => x.id === id);
          const inp = document.querySelector(`[data-admin-amt="${id}"]`);
          const amt = Math.max(0.01, Number(inp ? inp.value : 25) || 25);
          if (u) {
            u.wallet = Math.max(0, Number((u.wallet - amt).toFixed(2)));
            showToast(`Debited $${amt.toFixed(2)} from ${u.id}`, 'info');
            commitMutation();
          }
        }));
        document.querySelectorAll('[data-admin-toggle-plan]').forEach(b => b.addEventListener('click', () => {
          const u = state.users.find(x => x.id === b.dataset.adminTogglePlan);
          if (u) {
            const plans = normalizeUserPlans(u);
            if (getActivePlans(u).length > 0) {
              plans.forEach(pl => { pl.active = false; });
            } else if (plans.length > 0) {
              plans.forEach(pl => { pl.active = true; });
            } else {
              plans.push({ id: 'PLN-' + Math.floor(10000 + Math.random() * 90000), amount: 100, startIstDate: getIstDateKey(), maxDays: CYCLE_TOTAL_DAYS, active: true, activatedAt: nowStamp() });
            }
            syncLegacyPlanFields(u);
            showToast(`${u.id} Plans set to ${u.planActive ? 'ACTIVE ($' + u.planAmount + ')' : 'INACTIVE'}`);
            commitMutation();
          }
        }));
        document.querySelectorAll('[data-admin-toggle-bot]').forEach(b => b.addEventListener('click', () => {
          const u = state.users.find(x => x.id === b.dataset.adminToggleBot);
          if (u) { u.botActive = !u.botActive; showToast(`${u.id} $25 Bot set to ${u.botActive ? 'ACTIVE' : 'INACTIVE'}`); commitMutation(); }
        }));

        // Admin proof preview & approve/reject
        document.querySelectorAll('[data-view-proof]').forEach(b => b.addEventListener('click', () => {
          const tx = state.transactions.find(x => x.ref === b.dataset.viewProof);
          if (tx && tx.proof) openImageModal(tx.proof, `Deposit Proof — ${tx.ref} (${tx.userId})`);
        }));
        document.querySelectorAll('[data-tx-decision]').forEach(b => b.addEventListener('click', () => {
          const tx = state.transactions.find(x => x.ref === b.dataset.txRef);
          if (!tx || tx.status !== 'PENDING') return;
          const decision = b.dataset.txDecision;
          const user = state.users.find(u => u.id === tx.userId);
          tx.status = decision;
          if (tx.type === 'DEPOSIT' && decision === 'APPROVED' && user) {
            user.wallet = Number((user.wallet + tx.gross).toFixed(2));
          } else if (tx.type === 'WITHDRAWAL' && decision === 'REJECTED' && user) {
            user.wallet = Number((user.wallet + tx.gross).toFixed(2));
          }
          state.auditLogs.unshift({ time: nowStamp(), actor: 'partners-log', role: 'PARTNERS_LOG', ip: '172.68.14.9', action: `${tx.type}_${decision}`, detail: `${tx.ref} (${tx.userId})` });
          showToast(`${tx.ref} marked ${decision}`);
          commitMutation();
        }));

        // Admin Gateway & QR update
        const gwForm = document.getElementById('admin-gateway-form');
        if (gwForm) {
          gwForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const fd = new FormData(gwForm);
            const rail = String(fd.get('rail'));
            const name = String(fd.get('name')).trim();
            const account = String(fd.get('account')).trim();
            const fileInput = document.getElementById('admin-qr-upload');
            const applyGw = (imgData) => {
              const existing = state.gateways.find(g => g.rail === rail);
              if (existing) {
                existing.name = name;
                existing.account = account;
                existing.qrCustomImage = imgData || '';
              } else {
                state.gateways.push({ id: 'GW-' + Date.now(), name, rail, account, network: rail, instructions: 'Submit reference note & screenshot proof.', qrCustomImage: imgData || '', active: true });
              }
              showToast(`${rail} gateway & deposit QR updated for all users!`);
              commitMutation();
            };
            if (fileInput && fileInput.files && fileInput.files[0]) {
              const r = new FileReader();
              r.onload = () => applyGw(r.result);
              r.readAsDataURL(fileInput.files[0]);
            } else {
              applyGw('');
            }
          });
        }
      }

      // Hash & query routing support for Partners Log + Referral Signup links (#/register?ref=CODE)
      function syncHash() {
        const hash = window.location.hash || '';
        const search = window.location.search || '';
        const refMatch = (hash + '&' + search).match(/[?&]ref=([^&#\s]+)/i);
        if (refMatch && refMatch[1]) {
          state.pendingRefCode = decodeURIComponent(refMatch[1]).trim().toUpperCase();
          if (!state.currentUserId) {
            state.view = 'auth';
            state.authMode = 'register';
          }
        }
        if (hash === '#/admin' || hash === '#/partners-log') {
          state.view = state.adminAuthed ? 'admin' : 'admin-login';
        }
      }
      window.addEventListener('hashchange', () => { syncHash(); render(); });
      window.addEventListener('resize', () => {
        if (state.view === 'public') drawCandlestickChart('public-chart-canvas');
        if (state.view === 'user' && state.userTab === 'overview') drawCandlestickChart('user-chart-canvas');
      });

      loadLocalBackup();
      loadSession();
      state.users.forEach(u => { normalizeUserPlans(u); syncLegacyPlanFields(u); });
      syncHash();
      render();
      pullStateFromServer(true);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') pullStateFromServer(true);
      });
      window.addEventListener('focus', () => pullStateFromServer(true));
      let lastRenderedIstDay = getIstDateKey();
      setInterval(() => {
        pullStateFromServer(true);
        const nowIstDay = getIstDateKey();
        if (nowIstDay !== lastRenderedIstDay) {
          lastRenderedIstDay = nowIstDay;
          state.users.forEach(u => syncLegacyPlanFields(u));
          if (!document.activeElement?.matches('input, textarea, select')) render();
        }
      }, 5000);

      // Fetch real live prices + live candlesticks immediately, then poll every 10s
      fetchLiveTickers();
      fetchLiveCandles(state.selectedPair, state.selectedTimeframe);
      setInterval(() => {
        fetchLiveTickers();
        fetchLiveCandles(state.selectedPair, state.selectedTimeframe);
      }, 10000);
    })();
  </script>
</body>
</html>
