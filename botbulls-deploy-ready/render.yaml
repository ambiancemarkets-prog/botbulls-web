services:
  - type: web
    name: botbulls-web
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PARTNERS_LOG_USER
        value: admin
      - key: PARTNERS_LOG_PASS
        value: ayaz1104
      - key: DATABASE_URL
        sync: false
