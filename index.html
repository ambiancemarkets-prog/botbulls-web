  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { font-family: 'Inter', system-ui, sans-serif; overflow-y: auto; scroll-behavior: smooth; width: 100%; }

    #app { width: 100%; max-width: 100vw; overflow-x: clip; }

    .ticker-wrap { width: 100%; max-width: 100vw; overflow: hidden; white-space: nowrap; }
    .ticker-track { display: inline-flex; animation: tickerScroll 36s linear infinite; will-change: transform; }
    .ticker-track:hover { animation-play-state: paused; }
    @keyframes tickerScroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

    .pulse-dot { animation: pulseRing 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

    @keyframes blinkRedBlue {
      0%, 100% { color: #3b82f6; text-shadow: 0 0 8px rgba(59,130,246,0.55); }

    .blink-rate { animation: blinkRedBlue 1.8s ease-in-out infinite; }
    .blink-rate-alt { animation: blinkRedBlue 1.8s ease-in-out 0.9s infinite; }

    @keyframes mapDotRedBlue {
      0%, 100% { background-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.35), 0 0 12px #3b82f6; transform: scale(1); }

    .map-blink-dot-alt { animation: mapDotRedBlue 1.6s ease-in-out 0.8s infinite; }

      function generateQrSVG(seedText) {
        let hash = 2166136261;
        for (let i = 0; i < seedText.length; i++) { hash ^= seedText.charCodeAt(i); hash = Math.imul(hash, 16777619); }
        const size = 21;
        let rects = '';
        const isFinder = (r, c) => (r < 7 && c < 7) || (r < 7 && c >= size - 7) || (r >= size - 7 && c < 7);
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            let on = false;
            if (isFinder(r, c)) {
              const lr = r >= size - 7 ? r - (size - 7) : r;
              const lc = c >= size - 7 ? c - (size - 7) : c;
              on = lr === 0 || lr === 6 || lc === 0 || lc === 6 || (lr >= 2 && lr <= 4 && lc >= 2 && lc <= 4);
            } else {
              on = (Math.abs(Math.imul(hash ^ (r * 31 + c * 17), 2654435761)) % 11) < 5;
            }
            if (on) rects += `<rect x="${c * 8 + 8}" y="${r * 8 + 8}" width="8" height="8" fill="#0f172a"/>`;
          }
        }
        return `<svg viewBox="0 0 184 184" class="w-40 h-40 rounded-lg bg-white p-1.5 border border-slate-200 shadow-sm">${rects}</svg>`;
      }

      function drawChart(canvasId) {
        const canvas = document.getElementById(canvasId);
        if (!canvas || !canvas.parentElement) return;
        const rect = canvas.parentElement.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const w = Math.max(220, Math.floor(rect.width || 300)), h = Math.max(180, Math.floor(rect.height || 240));
        canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);
        ctx.fillStyle = state.darkMode ? '#0b1220' : '#f8fafc';
        ctx.fillRect(0, 0, w, h);
        const cs = state.chartCandles;
        if (!cs.length) return;
        const padL = 8, padR = 58, padT = 22, padB = 18;
        const pw = w - padL - padR, ph = h - padT - padB;
        let mn = Infinity, mx = -Infinity;
        cs.forEach(c => { if (c.low < mn) mn = c.low; if (c.high > mx) mx = c.high; });
        const rg = (mx - mn) || 1;
        const yFor = p => padT + ((mx - p) / rg) * ph;
        ctx.strokeStyle = state.darkMode ? 'rgba(148,163,184,0.12)' : 'rgba(100,116,139,0.18)';
        ctx.fillStyle = state.darkMode ? '#94a3b8' : '#475569';
        ctx.font = '10px JetBrains Mono, monospace';
        for (let i = 0; i <= 4; i++) {
          const y = padT + (ph / 4) * i, p = mx - (rg / 4) * i;
          ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
          ctx.fillText(p.toFixed(p > 100 ? 2 : 4), w - padR + 4, y + 3);
        }
        const step = pw / cs.length, bw = Math.max(2.5, step * 0.6);
        cs.forEach((c, i) => {
          const x = padL + i * step + step / 2, col = c.close >= c.open ? '#3b82f6' : '#ef4444';
          ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.moveTo(x, yFor(c.high)); ctx.lineTo(x, yFor(c.low)); ctx.stroke();
          const yt = yFor(Math.max(c.open, c.close)), yb = yFor(Math.min(c.open, c.close));
          ctx.fillRect(x - bw / 2, yt, bw, Math.max(2, yb - yt));
        });
        const last = cs[cs.length - 1], dp = last.close > 100 ? 2 : 4;
        ctx.fillStyle = state.darkMode ? '#e2e8f0' : '#0f172a';
        ctx.font = '10.5px JetBrains Mono, monospace';
        ctx.fillText(`${state.selectedPair} (${state.selectedTimeframe})  O:${last.open.toFixed(dp)} H:${last.high.toFixed(dp)} L:${last.low.toFixed(dp)} C:${last.close.toFixed(dp)}`, padL + 2, 14);
      }

      function render() {
        const langObj = LANGUAGES.find(l => l.code === state.lang) || LANGUAGES[0];
        document.documentElement.lang = langObj.code;
        document.documentElement.dir = langObj.rtl ? 'rtl' : 'ltr';
        document.documentElement.classList.toggle('dark', state.darkMode);
        saveSession();

        const root = document.getElementById('app');
        if (state.view === 'public') root.innerHTML = renderPublic();
        else if (state.view === 'auth') root.innerHTML = renderAuth();
        else if (state.view === 'user') root.innerHTML = renderUserPanel();
        else if (state.view === 'admin-login') root.innerHTML = renderAdminLogin();
        else if (state.view === 'admin') root.innerHTML = renderAdmin();

        if (window.lucide?.createIcons) window.lucide.createIcons();
        bindEvents();
        if (state.view === 'public') drawChart('public-chart-canvas');
        if (state.view === 'user' && state.userTab === 'overview') drawChart('user-chart-canvas');
      }

      function bindEvents() {
        ['pub-lang','pub-lang-mob','user-lang','user-lang-mob'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.onchange = (e) => { state.lang = e.target.value; render(); };
        });
        document.querySelectorAll('[data-action="toggle-theme"]').forEach(b => b.onclick = () => { state.darkMode = !state.darkMode; render(); });
        document.querySelectorAll('[data-action="toggle-mobile-menu"]').forEach(b => b.onclick = () => { state.mobileMenuOpen = !state.mobileMenuOpen; render(); });
        document.querySelectorAll('[data-action="close-mobile-menu"]').forEach(b => b.onclick = () => { state.mobileMenuOpen = false; render(); });
        document.querySelectorAll('[data-action="toggle-more"]').forEach(b => b.onclick = () => { state.mobileMoreSheetOpen = !state.mobileMoreSheetOpen; render(); });
        document.querySelectorAll('[data-action="close-more-bg"]').forEach(el => el.onclick = (e) => { if (e.target === el) { state.mobileMoreSheetOpen = false; render(); } });
        document.querySelectorAll('[data-action="open-login"]').forEach(b => b.onclick = () => { state.mobileMenuOpen = false; state.authMode = 'login'; state.view = 'auth'; render(); });
        document.querySelectorAll('[data-action="launch-demo"]').forEach(b => b.onclick = () => {
          state.mobileMenuOpen = false;
          state.isDemoSession = true;
          state.impersonatingFromAdmin = false;
          state.currentUserId = state.users[0]?.id || 'BB-USR-1001';

        // Admin User Controls (Open Panel, +$100, Expire Bot test, Renew 30d Bot)
        document.querySelectorAll('[data-open-user]').forEach(b => b.onclick = () => { state.impersonatingFromAdmin = true; state.currentUserId = b.dataset.openUser; state.view = 'user'; state.userTab = 'overview'; render(); });
        document.querySelectorAll('[data-adm-credit]').forEach(b => b.onclick = async () => { const u = state.users.find(x => x.id === b.dataset.admCredit); if (u) { u.wallet = Number((u.wallet + 100).toFixed(2)); const ar = tryAutoRenewBot(u, true); showToast(ar ? `Credited $100 to ${u.id} & auto-renewed Monthly Bot!` : `Credited $100 to ${u.id}`); await commitMutation(); } });
        document.querySelectorAll('[data-adm-expire-bot]').forEach(b => b.onclick = async () => { const u = state.users.find(x => x.id === b.dataset.admExpireBot); if (u) { u.botActive = false; u.botExpiresAt = Date.now() - 86400000; showToast(`${u.id} Monthly Bot marked EXPIRED (payouts & GWC paused)`, 'info'); await commitMutation(); } });
        document.querySelectorAll('[data-adm-renew-bot]').forEach(b => b.onclick = async () => { const u = state.users.find(x => x.id === b.dataset.admRenewBot); if (u) { u.botActive = true; u.botTierFee = getUserRequiredBotFee(u); u.botExpiresAt = Date.now() + 22 * 86400000; showToast(`${u.id} Monthly Bot renewed for 22 payout days/month (forward-only)`); await commitMutation(); } });

        // System Verifications + Email
        document.querySelectorAll('[data-view-proof]').forEach(b => b.onclick = () => { const tx = state.transactions.find(x => x.ref === b.dataset.viewProof); if (tx?.proof) openImageModal(tx.proof, `Proof — ${tx.ref}`); });
        document.querySelectorAll('[data-tx-dec]').forEach(b => b.onclick = async () => {
          const tx = state.transactions.find(x => x.ref === b.dataset.txRef), dec = b.dataset.txDec;
          if (!tx || tx.status !== 'PENDING') return;
          const u = state.users.find(x => x.id === tx.userId);
          tx.status = dec;
          if (tx.type === 'DEPOSIT' && dec === 'APPROVED' && u) { u.wallet = Number((u.wallet + tx.gross).toFixed(2)); tryAutoRenewBot(u, true); }
          if (tx.type === 'WITHDRAWAL' && dec === 'REJECTED' && u) u.wallet = Number((u.wallet + tx.gross).toFixed(2));
          if (u) triggerEmail(u.email, tx.type === 'DEPOSIT' ? 'DEPOSIT_STATUS' : 'WITHDRAWAL_STATUS', `${tx.type} ${dec} (${tx.ref})`, { fullName: u.name, txRef: tx.ref, amountUsd: tx.gross, grossUsd: tx.gross, deductionUsd: tx.deduction, netUsd: tx.net, rail: tx.rail, status: dec });
          showToast(`${tx.ref} marked ${dec} & email triggered.`);
          await commitMutation();
        });

        // User Support Ticket Creation
        const utf = document.getElementById('user-ticket-form');
        if (utf) utf.onsubmit = async (e) => {
          e.preventDefault();
          const u = getCurrentUser(), fd = new FormData(utf);
          const ref = 'TKT-' + Math.floor(10000 + Math.random() * 90000);
          state.supportTickets = state.supportTickets || [];
          state.supportTickets.unshift({
            ref, userId: u.id, userName: u.name, userEmail: u.email,
            category: String(fd.get('category') || 'ACCOUNT_GENERAL'),
            subject: String(fd.get('subject') || '').trim(),
            message: String(fd.get('message') || '').trim(),
            status: 'OPEN', reply: '', repliedAt: '', time: nowStamp(),
          });
          showToast(`Support ticket ${ref} raised! Our team will respond shortly.`);
          await commitMutation();
        };

        // Control Console Support Ticket Reply & Status Update
        document.querySelectorAll('[data-ticket-reply-form]').forEach(f => f.onsubmit = async (e) => {
          e.preventDefault();
          const ref = f.dataset.ticketReplyForm, fd = new FormData(f);
          const tk = (state.supportTickets || []).find(x => x.ref === ref);
          if (!tk) return;
          tk.reply = String(fd.get('reply') || '').trim();
          tk.status = String(fd.get('status') || 'RESOLVED');
          tk.repliedAt = nowStamp();
          showToast(`Reply sent & ticket ${ref} marked ${tk.status}!`);
          await commitMutation();
        });

        // User Explicit Auto-Pay Toggle Button
        document.querySelectorAll('[data-action="toggle-autopay"]').forEach(b => b.onclick = async () => {
          const u = getCurrentUser();
          if (!u) return;
          u.autoPayEnabled = u.autoPayEnabled === false ? true : false;
          if (u.autoPayEnabled) {
            const renewed = tryAutoRenewBot(u, true);
            showToast(renewed ? `Auto Pay turned ON & Monthly Bot auto-activated ($${getUserRequiredBotFee(u)} deducted).` : 'Auto Pay turned ON (will auto-deduct when renewal is due & funded).');
          } else {
            showToast('Auto Pay turned OFF. Bot renewals will wait for manual activation.', 'info');
          }
          await commitMutation();
        });

        // Compact History Dropdown, Date/Time, Range & Search Filters
        const hfm = document.getElementById('hist-filter-mode');
        if (hfm) hfm.onchange = () => { state.historyFilter = hfm.value; state.historyLimit = 12; render(); };
        const hdt = document.getElementById('hist-dt');
        if (hdt) hdt.onchange = () => { state.historyDate = hdt.value; render(); };
        const hfr = document.getElementById('hist-from');
        if (hfr) hfr.onchange = () => { state.historyFrom = hfr.value; render(); };
        const hto = document.getElementById('hist-to');
        if (hto) hto.onchange = () => { state.historyTo = hto.value; render(); };
        const hsr = document.getElementById('hist-search');
        if (hsr) hsr.oninput = () => { state.historySearch = hsr.value; render(); };
        document.querySelectorAll('[data-action="hist-more"]').forEach(b => b.onclick = () => { state.historyLimit = (state.historyLimit || 12) + 15; render(); });

        // Admin Run 1-Hour Staggered Cents Distribution (Mon-Fri Only)
        document.querySelectorAll('[data-action="admin-run-hourly-cents"]').forEach(b => b.onclick = async () => {
          if (!isWeekdayIst()) { showToast('Weekend Market Closed (Saturday/Sunday). Payouts & GWC run Monday–Friday only.', 'error'); return; }
          const hr = getIstHour();
          const dailyPct = Number(state.payoutConfig?.percent ?? 2.5);
          let totalPaid = 0, totalGwc = 0, cnt = 0;
          state.users.forEach(u => {
            if (!isUserEligibleForDaily(u)) return;
            const totPlan = getTotalActivePlan(u);
            const dailyTarget = Number(((totPlan * dailyPct) / 100).toFixed(2));
            const seed = parseInt(String(u.id).replace(/\D/g, '') || '1', 10) + Number(getIstDateKey().replace(/-/g, ''));
            const hrAmt = generate24HourCentsSchedule(dailyTarget, seed)[hr] || 0;
            if (hrAmt <= 0) return;
            u.wallet = Number((u.wallet + hrAmt).toFixed(2));
            totalPaid = Number((totalPaid + hrAmt).toFixed(2)); cnt++;
            state.transactions.unshift({ ref: `HPY-${String(hr).padStart(2,'0')}${Math.floor(1000+Math.random()*9000)}`, userId: u.id, type: 'DAILY_PAYOUT', rail: 'INTERNAL', gross: hrAmt, deduction: 0, net: hrAmt, status: 'COMPLETED', note: `Hourly Cents (${String(hr).padStart(2,'0')}:00) • Target $${dailyTarget.toFixed(2)}/day`, proof: '', time: nowStamp() });
            getUplines(u.id).forEach(up => {
              if (!isUserEligibleForDaily(up.user)) return;
              const g = Number(((hrAmt * up.pct) / 100).toFixed(2));
              if (g <= 0) return;
              up.user.wallet = Number((up.user.wallet + g).toFixed(2));
              totalGwc = Number((totalGwc + g).toFixed(2));
              state.transactions.unshift({ ref: `HGW-${String(hr).padStart(2,'0')}${Math.floor(1000+Math.random()*9000)}`, userId: up.user.id, type: 'GWC_DAILY', rail: 'INTERNAL', gross: g, deduction: 0, net: g, status: 'COMPLETED', note: `Hourly GWC L${up.level} (${up.pct.toFixed(2)}% of 2.5% pool) from ${u.id}`, proof: '', time: nowStamp() });
            });
          });
          showToast(`Hour ${String(hr).padStart(2,'0')}:00 credited $${totalPaid.toFixed(2)} across ${cnt} active user(s) + ${fmtMoney(totalGwc)} GWC!`);
          await commitMutation();
        });

        // Admin Auto-Bot Renewal Sweep
        document.querySelectorAll('[data-action="admin-auto-bot-sweep"]').forEach(b => b.onclick = async () => {
          const n = runAutoBotRenewalSweep();
          showToast(n > 0 ? `Auto-renewed Monthly Bot for ${n} user(s) from wallet balance!` : 'All eligible users already have active bots or insufficient balance.', 'info');
          await commitMutation();
        });

        // Admin Market & Wallet API Save & Test
        const aef = document.getElementById('admin-exchange-form');
        if (aef) aef.onsubmit = async (e) => {
          e.preventDefault();
          const fd = new FormData(aef);
          state.exchangeConfig = {
            provider: String(fd.get('provider') || 'MANUAL').toUpperCase(),
            mode: String(fd.get('mode') || 'MANUAL').toUpperCase(),
            apiKey: String(fd.get('apiKey') || '').trim(),
            apiSecret: String(fd.get('apiSecret') || '').trim(),
            passphrase: String(fd.get('passphrase') || '').trim(),
            customBaseUrl: String(fd.get('customBaseUrl') || '').trim(),
            defaultNetwork: String(fd.get('defaultNetwork') || 'TRC20').toUpperCase(),
            networkFeeUsd: Math.max(0, Number(fd.get('networkFeeUsd') || 0)),
          };
          if (IS_LIVE_BACKEND) {
            fetch('/api/admin/exchange/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(state.exchangeConfig) }).catch(() => {});
          }
          showToast(`Exchange API config saved (${state.exchangeConfig.provider} / ${state.exchangeConfig.mode})!`);
          await commitMutation();
        };
        document.querySelectorAll('[data-action="test-exchange-api"]').forEach(b => b.onclick = async () => {
          if (!IS_LIVE_BACKEND) { showToast(`Preview Mode: ${state.exchangeConfig.provider} config ready for live backend.`, 'info'); return; }
          try {
            const res = await fetch('/api/admin/exchange/test', { method: 'POST' });
            const j = await res.json();
            showToast(j.message || (j.ok ? 'Exchange API connected!' : 'Connection failed.'), j.ok ? 'success' : 'error');
          } catch { showToast('Could not reach Exchange API test endpoint.', 'error'); }
        });

        // Admin Gateways & Reward Photo Upload
        const agf = document.getElementById('admin-gw-form');
        if (agf) agf.onsubmit = (e) => {
          e.preventDefault();
          const fd = new FormData(agf), rail = String(fd.get('rail')), name = String(fd.get('name')).trim(), acc = String(fd.get('account')).trim();
          const fi = document.getElementById('adm-qr-file');
          const saveGw = async (img) => {
            const g = state.gateways.find(x => x.rail === rail);
            if (g) { g.name = name; g.account = acc; g.qrCustomImage = img || ''; }
            showToast(`${rail} gateway & QR updated!`);
            await commitMutation();
          };
          if (fi?.files?.[0]) { const r = new FileReader(); r.onload = () => saveGw(r.result); r.readAsDataURL(fi.files[0]); } else saveGw('');
        };
        document.querySelectorAll('[data-reward-photo]').forEach(inp => inp.onchange = (e) => {
          const f = e.target.files?.[0]; if (!f) return;
          const r = new FileReader();
          r.onload = async () => {
            const rw = state.rewards.find(x => x.id === inp.dataset.rewardPhoto);
            if (rw) { rw.photo = r.result; showToast(`Updated photo for ${rw.title}!`); await commitMutation(); }
          };
          r.readAsDataURL(f);
        });
      }

      // Hash & Query routing (?ref=CODE, /register?ref=CODE, #/register?ref=CODE, #/partners, #/admin)
      function syncHash() {
        const h = window.location.hash || '';
        const s = window.location.search || '';
        const refM = (s + '&' + h).match(/[?&#](?:ref|referral|sponsor)=([^&#\s]+)/i);
        if (refM?.[1]) {
          const code = extractRefCode(decodeURIComponent(refM[1])).toUpperCase();
          if (code) {
            state.pendingRefCode = code;
            try { sessionStorage.setItem('botbulls_pending_ref', code); } catch {}
            // Always open Register screen when a referral link is explicitly opened
            state.view = 'auth';
            state.authMode = 'register';
          }
        } else if (!state.pendingRefCode) {
          try {
            const savedRef = sessionStorage.getItem('botbulls_pending_ref');
            if (savedRef) state.pendingRefCode = savedRef;
          } catch {}
        }
        if (h === '#/register' || window.location.pathname === '/register') {
          if (!state.currentUserId) { state.view = 'auth'; state.authMode = 'register'; }
        }
        if (h === '#/control' || h === '#/admin' || h === '#/partners' || window.location.pathname === '/control' || window.location.pathname === '/admin' || window.location.pathname === '/partners') {
          state.view = state.adminAuthed ? 'admin' : 'admin-login';
        }
      }
      window.addEventListener('hashchange', () => { syncHash(); render(); });
      window.addEventListener('resize', () => { if (state.view === 'public') drawChart('public-chart-canvas'); if (state.view === 'user' && state.userTab === 'overview') drawChart('user-chart-canvas'); });

      // Boot
      try {
        const local = JSON.parse(localStorage.getItem('botbulls_v6_data') || 'null');
        if (local?.schemaVersion === 7 && Array.isArray(local.users)) {
          state.users = local.users;
          if (Array.isArray(local.gateways)) state.gateways = local.gateways;
          if (Array.isArray(local.rewards)) state.rewards = local.rewards;
          if (Array.isArray(local.transactions)) state.transactions = local.transactions;
          if (Array.isArray(local.emailLogs)) state.emailLogs = local.emailLogs;
          if (Array.isArray(local.supportTickets)) state.supportTickets = local.supportTickets;
        }
      } catch {}
      loadSession();
      syncHash();
      render();
      pullState(true);
      fetchLiveMarket();
      fetchLiveCandles(state.selectedPair);
      startLiveMarketSocket();
      setInterval(() => { pullState(true); fetchLiveMarket(); }, 10000);
      // Smooth live-style blue & red candle fluctuation every 1.6s
      setInterval(() => {
        if (!state.chartCandles.length) return;
        const last = state.chartCandles[state.chartCandles.length - 1];
        const vol = Math.max(0.0002, last.close * 0.0009);
        const delta = (Math.random() - 0.49) * vol;
        last.close = Math.max(0.0001, last.close + delta);
        if (last.close > last.high) last.high = last.close;
        if (last.close < last.low) last.low = last.close;
        if (Math.random() < 0.12) {
          const o = last.close;
          const c = Math.max(0.0001, o + (Math.random() - 0.49) * vol * 1.4);
          state.chartCandles.push({ open: o, close: c, high: Math.max(o, c) + vol * 0.35, low: Math.min(o, c) - vol * 0.35 });
          if (state.chartCandles.length > 44) state.chartCandles.shift();
        }
        if (state.view === 'public') drawChart('public-chart-canvas');
        if (state.view === 'user' && state.userTab === 'overview') drawChart('user-chart-canvas');
      }, 1600);
    })();
  </script>
</body>
</html>
