# BotBulls (botbulls.com) — Production Nginx Reverse Proxy with HTTPS / SSL
# Install to: /etc/nginx/sites-available/botbulls.com
# Enable via: sudo ln -s /etc/nginx/sites-available/botbulls.com /etc/nginx/sites-enabled/
# Then issue free SSL via: sudo certbot --nginx -d botbulls.com -d www.botbulls.com

server {
    listen 80;
    listen [::]:80;
    server_name botbulls.com www.botbulls.com;

    # Redirect all HTTP traffic to HTTPS once Certbot SSL is active
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://botbulls.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name botbulls.com www.botbulls.com;

    # Certbot SSL Certificates (auto-populated by certbot --nginx)
    ssl_certificate     /etc/letsencrypt/live/botbulls.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/botbulls.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Allow deposit screenshot & QR uploads up to 15MB
    client_max_body_size 15M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Proxy all frontend & /api/* requests to Node.js / PM2 on port 4000
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
